name: Provjera zaliha

# Rezervni okidac: provjera se izvrsava na Vercelu (/api/cron), GitHub je samo pokrene.
# Glavni okidac je vanjski cron servis (vidi Admin tab na stranici).
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # potpisani token kojim se GitHub prijavljuje na Vercel stranicu

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Pokreni provjeru na Vercelu
        run: |
          TOKEN=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=iphone-stock-checker" | jq -r .value)
          RES=$(curl -sS -m 90 -w '\n%{http_code}' -H "Authorization: Bearer $TOKEN" "${APP_URL:-https://iphone-stock-checker-hazel.vercel.app}/api/cron")
          CODE=$(echo "$RES" | tail -n1); BODY=$(echo "$RES" | sed '$d')
          echo "::notice::HTTP $CODE $(echo "$BODY" | head -c 900)"
          [ "$CODE" = "200" ]
        env:
          APP_URL: ${{ vars.APP_URL }}
