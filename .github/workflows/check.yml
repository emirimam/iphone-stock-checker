name: Provjera zaliha

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      diag:
        description: "Dijagnostika Apple zahtjeva"
        type: boolean
        default: false

concurrency:
  group: stock-check
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # potpisani token kojim se GitHub prijavljuje na Vercel stranicu

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ucitaj prethodno stanje
        uses: actions/cache/restore@v4
        with:
          path: state
          key: stock-state-${{ github.run_id }}
          restore-keys: stock-state-

      - name: Dijagnostika
        if: ${{ inputs.diag }}
        run: node scripts/probe.mjs https://iphone-stock-checker-hazel.vercel.app

      - name: Provjeri zalihe
        if: ${{ !inputs.diag }}
        run: mkdir -p state && node scripts/notify.mjs
        env:
          APP_URL: ${{ vars.APP_URL }}

      - name: Sacuvaj stanje
        if: ${{ !inputs.diag && always() }}
        uses: actions/cache/save@v4
        with:
          path: state
          key: stock-state-${{ github.run_id }}
