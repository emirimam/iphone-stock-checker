<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iPhone Stock</title>
<style>
  :root {
    --bg: #f5f5f7; --card: #ffffff; --text: #1d1d1f; --muted: #6e6e73; --line: #e3e3e8;
    --ok: #1f8a3b; --ok-bg: #e6f4ea; --no: #8e8e93; --no-bg: #f0f0f3; --accent: #0066cc;
    --err: #c0392b; --warn-bg: #fff6e0; --warn: #8a5a00;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b0b0d; --card: #18181b; --text: #f5f5f7; --muted: #a1a1aa; --line: #2a2a30;
      --ok: #4ade80; --ok-bg: #14301d; --no: #71717a; --no-bg: #222227; --accent: #4da3ff;
      --err: #f87171; --warn-bg: #2d2410; --warn: #f5c869; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 780px; margin: 0 auto; padding: 24px 16px 56px; }
  h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -0.02em; }
  h2 { font-size: 18px; margin: 28px 0 10px; }
  h3 { font-size: 15px; margin: 0; }
  .sub { color: var(--muted); margin: 0 0 16px; }
  .bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  button { padding: 9px 16px; border-radius: 10px; border: 0; background: var(--accent); color: #fff;
    font: inherit; font-weight: 600; cursor: pointer; }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
  button:disabled { opacity: .55; cursor: wait; }
  .status { color: var(--muted); font-size: 13px; }
  .banner { padding: 14px 16px; border-radius: 14px; margin-bottom: 14px; }
  .banner.ok { background: var(--ok-bg); color: var(--ok); font-weight: 600; }
  .banner.no { background: var(--card); border: 1px solid var(--line); color: var(--muted); }
  .banner.err { background: var(--card); border: 1px solid var(--err); color: var(--err); }
  .banner.warn { background: var(--warn-bg); color: var(--warn); }
  .banner a { color: inherit; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; }
  .meta { color: var(--muted); font-size: 13px; margin: 2px 0 10px; }
  .grid { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 12.5px; padding: 5px 9px; border-radius: 999px; background: var(--no-bg); color: var(--no); }
  .chip.ok { background: var(--ok-bg); color: var(--ok); font-weight: 600; }
  .group { margin-top: 10px; }
  .group-label { font-size: 12.5px; color: var(--muted); margin-bottom: 5px; }
  details.settings { background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin-top: 28px; }
  details.settings > summary { padding: 14px 16px; font-weight: 600; cursor: pointer; list-style: none; }
  details.settings > summary::-webkit-details-marker { display: none; }
  details.settings > summary::after { content: "▾"; float: right; color: var(--muted); }
  details.settings[open] > summary::after { content: "▴"; }
  .sbody { padding: 0 16px 16px; }
  fieldset { border: 0; padding: 0; margin: 0 0 16px; }
  legend { font-weight: 600; font-size: 14px; margin-bottom: 8px; }
  .hint { color: var(--muted); font-size: 12.5px; margin: 4px 0 0; }
  .opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .opt { position: relative; }
  .opt input { position: absolute; opacity: 0; pointer-events: none; }
  .opt span { display: inline-block; padding: 6px 11px; border-radius: 999px; border: 1px solid var(--line);
    font-size: 13px; cursor: pointer; user-select: none; text-transform: capitalize; }
  .opt input:checked + span { background: var(--accent); border-color: var(--accent); color: #fff; }
  .opt input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
  label.f { display: block; font-size: 13px; color: var(--muted); }
  label.f input, label.f select { display: block; width: 100%; margin-top: 4px; padding: 9px 10px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; }
  .switch { display: flex; align-items: center; gap: 10px; font-size: 14px; cursor: pointer; }
  .switch input { width: 18px; height: 18px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
  .msg { font-size: 13px; }
  .msg.ok { color: var(--ok); } .msg.err { color: var(--err); }
  .locked { opacity: .5; pointer-events: none; }
  footer { color: var(--muted); font-size: 12.5px; margin-top: 24px; }
  .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .lang { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; flex: none; margin-top: 2px; }
  .lang button { background: transparent; color: var(--muted); border: 0; border-radius: 0; padding: 6px 12px; font-weight: 600; font-size: 13px; }
  .lang button.on { background: var(--accent); color: #fff; }
  .flash { animation: flash 1.2s ease-out; }
  @keyframes flash { 0% { color: var(--ok); } 100% { color: var(--muted); } }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1 data-i18n="title"></h1>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="bs">BS</button>
    </div>
  </div>
  <p class="sub" id="sub"></p>

  <div class="bar">
    <button id="live" data-i18n="checkNow"></button>
    <span class="status" id="status"></span>
  </div>

  <div id="setup"></div>
  <div id="banner"></div>

  <h2 data-i18n="wantedTitle"></h2>
  <div id="wanted"><div class="banner no" data-i18n="loading"></div></div>

  <h2 data-i18n="othersTitle"></h2>
  <div id="others"><div class="banner no" data-i18n="loading"></div></div>

  <details class="settings" id="settingsBox">
    <summary data-i18n="settingsTitle"></summary>
    <div class="sbody">
      <div id="newPinBox" style="display:none">
        <p class="hint" style="margin:0 0 10px" data-i18n="newPinHint"></p>
        <div class="row">
          <label class="f"><span data-i18n="newPin"></span><input id="newPin" type="password" autocomplete="new-password"></label>
          <label class="f"><span data-i18n="repeatPin"></span><input id="newPin2" type="password" autocomplete="new-password"></label>
        </div>
        <div class="actions"><button id="setPin" data-i18n="setPin"></button><span class="msg" id="newPinMsg"></span></div>
      </div>
      <div id="loginBox">
        <div class="row">
          <label class="f"><span data-i18n="pinLabel"></span><input id="pin" type="password" autocomplete="current-password"></label>
        </div>
        <div class="actions"><button id="login" data-i18n="unlock"></button><span class="msg" id="loginMsg"></span></div>
        <p class="hint" data-i18n="pinHint"></p>
      </div>

      <form id="form" class="locked" onsubmit="return false">
        <fieldset>
          <legend data-i18n="whichPhone"></legend>
          <div class="opts" id="models"></div>
          <p class="hint" data-i18n="whichPhoneHint"></p>
        </fieldset>
        <fieldset>
          <legend data-i18n="storage"></legend>
          <div class="opts" id="storages"></div>
          <p class="hint" data-i18n="anyHint"></p>
        </fieldset>
        <fieldset>
          <legend data-i18n="color"></legend>
          <div class="opts" id="colors"></div>
          <p class="hint" data-i18n="anyHint"></p>
        </fieldset>
        <fieldset>
          <legend data-i18n="location"></legend>
          <div class="row">
            <label class="f"><span data-i18n="zip"></span><input id="zip" inputmode="numeric" maxlength="5"></label>
            <label class="f"><span data-i18n="maxMiles"></span><input id="maxMiles" type="number" min="1" max="500"></label>
          </div>
        </fieldset>
        <fieldset>
          <legend data-i18n="notifications"></legend>
          <label class="switch"><input type="checkbox" id="enabled"> <span data-i18n="sendNotifications"></span></label>
          <div class="row" style="margin-top:12px">
            <label class="f">ntfy topic<input id="ntfyTopic" autocomplete="off" spellcheck="false"></label>
            <label class="f"><span data-i18n="emailOptional"></span><input id="email" type="email" autocomplete="email"></label>
            <label class="f"><span data-i18n="priority"></span>
              <select id="priority">
                <option value="min" data-i18n="prioMin"></option>
                <option value="low" data-i18n="prioLow"></option>
                <option value="default" data-i18n="prioDefault"></option>
                <option value="high" data-i18n="prioHigh"></option>
                <option value="urgent" data-i18n="prioUrgent"></option>
              </select>
            </label>
            <label class="f"><span data-i18n="repeat"></span>
              <select id="repeatHours">
                <option value="0" data-i18n="rep0"></option>
                <option value="1" data-i18n="rep1"></option>
                <option value="3" data-i18n="rep3"></option>
                <option value="6" data-i18n="rep6"></option>
                <option value="12" data-i18n="rep12"></option>
              </select>
            </label>
          </div>
          <p class="hint" data-i18n-html="ntfyHint"></p>
        </fieldset>
        <div class="actions">
          <button id="save" data-i18n="save"></button>
          <button id="test" class="ghost" data-i18n="sendTest"></button>
          <span class="msg" id="saveMsg"></span>
        </div>
      </form>
    </div>
  </details>

  <footer data-i18n="footer"></footer>
</main>
<script>

    save: "Save",

    notSet: "not set",
    justNow: "just now",
    minAgo: (m) => `${m} min ago`,
    hAgo: (h, m) => `${h} h ${m} min ago`,
    lastAuto: "Last automatic check",
    lastLive: "Last live check",
    lastFailed: (e) => `Last check failed: ${e}`,
    wantedInStock: (n) => `Wanted phones in stock: ${n}`,
    orderPickup: "order online for pickup",
    noneWanted: "None of the phones you're looking for are available for pickup right now.",
    noStores: (miles) => `No Apple Store within ${miles} miles. Increase the distance in settings.`,
    availableOf: (a, n) => `${a}/${n} available`,
    noConfigs: "Apple doesn't offer any configuration matching your filters.",
    noOthers: "No other models are in stock right now.",
    warnStorage: "The page can't see the database. If you just connected it, open <b>Deployments</b> in Vercel and click <b>⋯ → Redeploy</b> on the latest one.",
    warnPin: "Set a PIN: open <b>Settings & notifications</b> at the bottom of the page.",
    warnTopic: "Notifications don't have an ntfy topic yet. Set it in Settings.",
    loadFailed: (e) => `Couldn't load settings: ${e}`,
    liveFailed: (e) => `Live check failed (${e}).`,

    pinMismatch: "PINs don't match.",
    pinSet: "PIN set. Now choose your phone and enter your ntfy topic.",
    saving: "Saving…",
    saved: "Saved. The next automatic check will use the new settings.",
    sending: "Sending…",
    testSent: "Test notification sent — check your phone.",
    err: {
      pin_required: "Enter your PIN.",
      pin_wrong: "Wrong PIN.",
      pin_not_set: "PIN has not been set yet.",
      pin_short: "PIN must be at least 4 characters.",
      pin_exists: "PIN is already set.",
      no_storage: "Database is not connected.",
      no_topic: "Enter an ntfy topic first.",
    },
  },
  bs: {
    title: "iPhone zalihe",
    sub: (miles, zip) => `Apple Store preuzimanje do ${miles} milja od ZIP ${zip}.`,
    subDefault: "Apple Store preuzimanje u blizini.",
    checkNow: "Provjeri sada",
    checking: "Provjeravam…",
    loading: "Učitavam…",
    wantedTitle: "Traženi telefoni",
    othersTitle: "Ostali dostupni telefoni",
    settingsTitle: "Podešavanja i obavijesti",
    newPinHint: "Prvi put ovdje: izaberi PIN (najmanje 4 znaka). Njime ćeš otključavati podešavanja.",
    newPin: "Novi PIN",
    repeatPin: "Ponovi PIN",
    setPin: "Postavi PIN",
    pinLabel: "PIN za izmjene",
    unlock: "Otključaj",
    pinHint: "Bez PIN-a podešavanja su samo za pregled.",
    whichPhone: "Koji telefon tražim",
    whichPhoneHint: "Za ove modele stiže obavijest. Svi ostali se prikazuju pod „Ostali dostupni telefoni“.",
    storage: "Memorija",

    zip: "ZIP kod",

    prioHigh: "Visok",
    prioUrgent: "Hitan (zvoni dugo)",

    sendTest: "Pošalji probnu poruku",
    footer: "GitHub provjerava zalihe svakih 15 minuta i šalje obavijest za tražene modele. „Provjeri sada“ radi provjeru odmah.",
    notSet: "nije postavljen",
    justNow: "upravo",
    minAgo: (m) => `prije ${m} min`,
    hAgo: (h, m) => `prije ${h} h ${m} min`,
    lastAuto: "Zadnja automatska provjera",
    lastLive: "Zadnja provjera uživo",
    lastFailed: (e) => `Zadnja provjera nije uspjela: ${e}`,
    wantedInStock: (n) => `Traženo na stanju: ${n}`,
    orderPickup: "naruči online za preuzimanje",
    noneWanted: "Trenutno nijedan traženi model nije dostupan za preuzimanje.",
    noStores: (miles) => `Nema Apple Storea u radijusu od ${miles} milja. Povećaj udaljenost u podešavanjima.`,
    availableOf: (a, n) => `dostupno ${a}/${n}`,
    noConfigs: "Za izabrane filtere Apple ne nudi nijednu konfiguraciju.",
    noOthers: "Trenutno nema drugih dostupnih modela.",
    warnStorage: "Baza nije vidljiva stranici. Ako si je upravo povezao, u Vercelu otvori <b>Deployments</b> i na zadnjem klikni <b>⋯ → Redeploy</b>.",
    warnPin: "Postavi PIN: otvori <b>Podešavanja i obavijesti</b> na dnu stranice.",
    warnTopic: "Obavijesti još nemaju ntfy topic. Postavi ga u Podešavanjima.",
    loadFailed: (e) => `Ne mogu učitati podešavanja: ${e}`,
    liveFailed: (e) => `Provjera uživo nije uspjela (${e}).`,
    showingLast: " Prikazujem zadnju automatsku provjeru.",
    pinShort: "PIN mora imati najmanje 4 znaka.",
    pinMismatch: "PIN-ovi se ne poklapaju.",
    pinSet: "PIN postavljen. Sad izaberi telefon i upiši ntfy topic.",
    saving: "Spremam…",
    saved: "Sačuvano. Sljedeća automatska provjera koristi nova podešavanja.",
    sending: "Šaljem…",
    testSent: "Probna poruka poslana — provjeri mobitel.",
    err: {
      pin_required: "Unesi PIN.",
      pin_wrong: "Pogrešan PIN.",
      pin_not_set: "PIN još nije postavljen.",
      pin_short: "PIN mora imati najmanje 4 znaka.",
      pin_exists: "PIN je već postavljen.",
      no_storage: "Baza nije povezana.",
      no_topic: "Prvo upiši ntfy topic.",
    },
  },
};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const BASE_COLORS = ["black", "silver", "glacier", "burgundy"];
let state = { settings: null, options: null, status: null, last: null, authorized: false, pin: "" };

const store = {
  get(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};

let lang = store.get("lang") || "en";
const T = () => I18N[lang] || I18N.en;
const errText = (e) => (e.code && T().err[e.code]) || e.message;

function applyLang() {
  document.documentElement.lang = lang;
  document.title = T().title;
  document.querySelectorAll("[data-i18n]").forEach((el) => { const v = T()[el.dataset.i18n]; if (typeof v === "string") el.textContent = v; });
  document.querySelectorAll("[data-i18n-html]").forEach((el) => { el.innerHTML = T()[el.dataset.i18nHtml]; });
  document.querySelectorAll("[data-lang]").forEach((b) => b.classList.toggle("on", b.dataset.lang === lang));
  if (!state.last) $("sub").textContent = T().subDefault;
}

function ago(iso) {
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return T().justNow;
  if (m < 60) return T().minAgo(m);
  return T().hAgo(Math.floor(m / 60), m % 60);
}

async function api(method, body) {
  const r = await fetch("/api/settings", {
    method,
    headers: { "Content-Type": "application/json", "x-pin": state.pin },
    body: body ? JSON.stringify({ pin: state.pin, ...body }) : undefined,
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(d.error || `HTTP ${r.status}`); e.code = d.code; throw e; }
  return d;
}

// ---------- results
function render(d, extraBanner = "") {
  if (!d) return;
  state.last = d;
  const t = T();
  if (d.error) {
    $("banner").innerHTML = extraBanner + `<div class="banner err">${esc(t.lastFailed(d.error))}</div>`;
    return;
  }
  const locale = lang === "bs" ? "bs-BA" : "en-US";
  const label = d.source === "github" ? t.lastAuto : t.lastLive;
  $("status").textContent = `${label}: ${ago(d.checkedAt)} (${new Date(d.checkedAt).toLocaleTimeString(locale, { hour: "2-digit", minute: "2-digit" })})`;
  $("sub").textContent = t.sub(d.maxMiles, d.zip);

  const n = d.available.length;
  $("banner").innerHTML = extraBanner + (n
    ? `<div class="banner ok">${esc(t.wantedInStock(n))} — <a href="${esc(d.buyUrl)}" target="_blank" rel="noopener">${esc(t.orderPickup)}</a></div>`
    : `<div class="banner no">${esc(t.noneWanted)}</div>`);

  if (!d.stores.length) {
    const none = `<div class="banner no">${esc(t.noStores(d.maxMiles))}</div>`;
    $("wanted").innerHTML = none; $("others").innerHTML = none;
    return;
  }

  $("wanted").innerHTML = d.stores.map((s) => {
    const items = s.items.filter((i) => i.wanted);
    if (!items.length) return "";
    const avail = items.filter((i) => i.available).length;
    return `<div class="card"><h3>${esc(s.name)}</h3>
      <div class="meta">${esc(s.city)} · ${s.distance} mi · ${esc(t.availableOf(avail, items.length))}</div>
      <div class="grid">${items.map((i) => `<span class="chip ${i.available ? "ok" : ""}" title="${esc(i.quote)}">${esc(i.title.replace(/^iPhone\s*/i, ""))}</span>`).join("")}</div></div>`;
  }).join("") || `<div class="banner no">${esc(t.noConfigs)}</div>`;

  const others = d.stores.map((s) => {
    const items = s.items.filter((i) => !i.wanted && i.available);
    if (!items.length) return "";
    const groups = {};
    for (const i of items) {
      const g = i.title.replace(/\s+\d+\s*(GB|TB)\b.*$/i, "");
      (groups[g] ||= []).push(i);
    }
    return `<div class="card"><h3>${esc(s.name)}</h3><div class="meta">${esc(s.city)} · ${s.distance} mi</div>` +
      Object.entries(groups).map(([g, list]) => `<div class="group"><div class="group-label">${esc(g)} · ${list.length}</div>
        <div class="grid">${list.map((i) => `<span class="chip ok" title="${esc(i.quote)}">${esc([i.storage.toUpperCase(), i.color].filter(Boolean).join(" "))}</span>`).join("")}</div></div>`).join("") +
      `</div>`;
  }).join("");
  $("others").innerHTML = others || `<div class="banner no">${esc(t.noOthers)}</div>`;

  const seen = new Set(BASE_COLORS);
  d.stores.forEach((s) => s.items.forEach((i) => { if (i.color && state.settings && state.settings.models.includes(i.model)) seen.add(i.color); }));
  if (state.options) renderOpts("colors", [...seen], state.settings?.colors || [], (c) => c);
}

// ---------- settings
function renderOpts(id, values, selected, labelOf) {
  $(id).innerHTML = values.map((v) => `<label class="opt"><input type="checkbox" name="${id}" value="${esc(v)}" ${selected.includes(v) ? "checked" : ""}><span>${esc(labelOf(v))}</span></label>`).join("");
}

function fillForm() {
  const s = state.settings, o = state.options;
  if (!s || !o) return;
  renderOpts("models", o.models, s.models, (m) => o.modelLabels[m] || m);
  renderOpts("storages", o.storages, s.storages, (v) => v.toUpperCase());
  renderOpts("colors", [...new Set([...BASE_COLORS, ...s.colors])], s.colors, (c) => c);
  $("zip").value = s.zip;
  $("maxMiles").value = s.maxMiles;
  $("enabled").checked = s.enabled;
  $("priority").value = s.priority;
  $("repeatHours").value = String(s.repeatHours);
  $("ntfyTopic").value = "";
  $("email").value = "";
  $("ntfyTopic").placeholder = s.ntfyTopic || T().notSet;
  $("email").placeholder = s.email || T().notSet;
  $("form").classList.toggle("locked", !state.authorized);
  $("newPinBox").style.display = !state.authorized && state.storage && !state.pinConfigured ? "" : "none";
  $("loginBox").style.display = state.authorized || !state.pinConfigured ? "none" : "";
}

function readForm() {
  const checked = (name) => [...document.querySelectorAll(`input[name="${name}"]:checked`)].map((i) => i.value);
  const out = {
    models: checked("models"),
    storages: checked("storages"),
    colors: checked("colors"),
    zip: $("zip").value.trim(),
    maxMiles: Number($("maxMiles").value),
    enabled: $("enabled").checked,
    priority: $("priority").value,
    repeatHours: Number($("repeatHours").value),
    lang,
  };
  if ($("ntfyTopic").value.trim()) out.ntfyTopic = $("ntfyTopic").value.trim();
  if ($("email").value.trim()) out.email = $("email").value.trim();
  return out;
}

function setupWarnings(d) {
  if (!d) return;
  const t = T(), w = [];
  if (!d.storage) w.push(t.warnStorage);
  else if (!d.pinConfigured && !state.pinConfigured) w.push(t.warnPin);
  if (d.storage && state.settings && !state.settings.ntfyTopic && !state.settings.ntfyTopicSet) w.push(t.warnTopic);
  $("setup").innerHTML = w.map((x) => `<div class="banner warn">${x}</div>`).join("");
}

async function load() {
  state.pin = store.get("pin");
  try {
    const d = await api("GET");
    state.meta = d;
    state.settings = d.settings; state.options = d.options; state.authorized = d.authorized; state.status = d.status;
    state.storage = d.storage; state.pinConfigured = d.pinConfigured;
    if (d.storage && !d.pinConfigured) $("settingsBox").open = true;
    setupWarnings(d);
    fillForm();
    if (d.status) render(d.status); else liveCheck();
  } catch (e) {
    $("setup").innerHTML = `<div class="banner err">${esc(T().loadFailed(errText(e)))}</div>`;
    liveCheck();
  }
}

async function liveCheck() {
  $("live").disabled = true;
  $("live").textContent = T().checking;
  $("status").textContent = "";
  try {
    const r = await fetch(`/api/check?t=${Date.now()}`, { cache: "no-store" });
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    render(d);
  } catch (e) {
    $("status").textContent = "";
    const fallback = state.status && !state.status.error;
    const b = `<div class="banner err">${esc(T().liveFailed(e.message))}${fallback ? esc(T().showingLast) : ""}</div>`;
    if (fallback) render(state.status, b); else $("banner").innerHTML = b;
  } finally {
    $("live").disabled = false;
    $("live").textContent = T().checkNow;
    flash($("status"));
  }
}

function flash(el) {
  el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
}

function afterUnlock(d, msg) {
  store.set("pin", state.pin);
  state.authorized = true; state.pinConfigured = true; state.settings = d.settings;
  setupWarnings(state.meta);
  fillForm();
  if (msg) { $("saveMsg").className = "msg ok"; $("saveMsg").textContent = msg; }
}

$("live").addEventListener("click", liveCheck);

document.querySelectorAll("[data-lang]").forEach((b) => b.addEventListener("click", async () => {
  lang = b.dataset.lang;
  store.set("lang", lang);
  applyLang();
  fillForm();
  setupWarnings(state.meta);
  if (state.last) render(state.last);
  // jezik obavijesti prati jezik stranice
  if (state.authorized) { try { state.settings = (await api("POST", { action: "save", settings: { lang } })).settings; } catch (e) {} }
}));

$("login").addEventListener("click", async () => {
  state.pin = $("pin").value;
  $("loginMsg").textContent = "";
  try {
    try {
      afterUnlock(await api("POST", { action: "login" }));
    } catch (e) {
      if (e.code !== "pin_not_set") throw e;
      // PIN jos ne postoji: upisani PIN postaje novi PIN
      if (state.pin.length < 4) throw Object.assign(new Error(T().pinShort), { code: "pin_short" });
      afterUnlock(await api("POST", { action: "setpin", newPin: state.pin }), T().pinSet);
    }
  } catch (e) {
    $("loginMsg").className = "msg err"; $("loginMsg").textContent = errText(e);
  }
});

$("setPin").addEventListener("click", async () => {
  const m = $("newPinMsg"); m.className = "msg err";
  const a = $("newPin").value, b = $("newPin2").value;
  if (a.length < 4) { m.textContent = T().pinShort; return; }
  if (a !== b) { m.textContent = T().pinMismatch; return; }
  try {
    const d = await api("POST", { action: "setpin", newPin: a });
    state.pin = a;
    afterUnlock(d, T().pinSet);
  } catch (e) { m.textContent = errText(e); }
});

$("save").addEventListener("click", async () => {
  const m = $("saveMsg"); m.className = "msg"; m.textContent = T().saving;
  $("save").disabled = true;
  try {
    const d = await api("POST", { action: "save", settings: readForm() });
    state.settings = d.settings;
    fillForm();
    setupWarnings(state.meta);
    m.className = "msg ok"; m.textContent = T().saved;
    liveCheck();
  } catch (e) {
    m.className = "msg err"; m.textContent = errText(e);
  } finally {
    $("save").disabled = false;
  }
});

$("test").addEventListener("click", async () => {
  const m = $("saveMsg"); m.className = "msg"; m.textContent = T().sending;
  try {
    state.settings = (await api("POST", { action: "save", settings: readForm() })).settings;
    fillForm();
    setupWarnings(state.meta);
    await api("POST", { action: "test", origin: location.origin });
    m.className = "msg ok"; m.textContent = T().testSent;
  } catch (e) {
    m.className = "msg err"; m.textContent = errText(e);
  }
});

applyLang();
load();
setInterval(() => { if (state.status) load(); }, 5 * 60 * 1000);
</script>
</body>
</html>
